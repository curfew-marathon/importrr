name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least privilege by default. publish-docker overrides this with packages: write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov mypy
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f pyproject.toml ]; then pip install .; fi

    - name: Lint and Format with ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Type Check with mypy
      run: |
        mypy .

    - name: Run Tests with pytest and coverage
      env:
        PYTHONPATH: .:src
      run: |
        pytest --cov=. --cov-report=term-missing

  compose-check:
    name: Docker Compose Config Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Validate docker-compose.yml syntax
      run: |
        touch .env
        docker compose config --quiet

  publish-docker:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [test, compose-check]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-docker-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v7

    - name: Log in to ghcr.io
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # linux/arm64 is built under emulation on the amd64 runner.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,format=short

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
